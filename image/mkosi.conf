# Ingot main image: the whole bootable system, built as a single GPT
# disk image (mkosi-native flow, no sub-images).
#
# The build pins a Fedora Rawhide compose (tools/pins.json); the
# Snapshot= below MUST match tools/pins.json:compose.id (tools/build.sh
# checks this before building). With --local the compose is served from
# the archived mirror (tools/archive-compose.sh) via --local-mirror.
#
# Output (dist/, relative to this file's directory):
#   ingot_0.1.0.raw          whole-disk GPT image (the harness boots this)
#   ingot_0.1.0.slot.raw     split artifact: the active slot's whole-image
#                            erofs (zstd) (SplitName=slot); the unit of
#                            reproducibility and the sysupdate transfer
#   ingot_0.1.0.efi          split artifact: the signed UKI
#   ingot_0.1.0.vmlinuz      split artifact: the kernel
#   ingot_0.1.0.initrd       split artifact: the initramfs (from the UKI)
#   ingot_0.1.0.manifest.json
#
# UKI build (native): kernel + initramfs + CPU microcode come from the
# image itself. The initramfs is dracut-built in the postinst script and
# handed to mkosi via --initrd (tools/build.sh), staged at
# dist/ingot-0.1.0.initrd (hyphen name: the underscore name is the split
# initrd artifact). The CPU microcode initrd (UKI .ucode section) is
# built by mkosi natively from /usr/lib/firmware/amd-ucode; the postinst
# script removes the README.xz so only container files are concatenated.
#
# Secure Boot: the UKI and the systemd-boot fallback are signed with the
# snakeoil test key, matching the pinned OVMF snakeoil vars image in the
# harness.

[Distribution]
Distribution=fedora
Snapshot=20260916.n.0
Release=rawhide
Architecture=x86-64

[Output]
Format=disk
Output=ingot_0.1.0
OutputDirectory=../dist
ImageId=ingot
ImageVersion=0.1.0
ManifestFormat=json
# fixed seed: any repart-internal UUID derivation stays deterministic
Seed=1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
# uki: standalone signed UKI; partitions: the erofs slot split artifact
# (SplitName=slot); kernel/initrd: standalone components
SplitArtifacts=uki,kernel,initrd,partitions

[Content]
# fixed file mtimes across builds: every file newer than this is
# clamped to it, so the erofs slot artifact is bit-reproducible
SourceDateEpoch=1789516800
# Ingot payload files (dracut 99ingot module, factory
# /etc defaults): copied into the image root before the postinst phase
# (mkosi order: build scripts -> extra trees -> postinst), so the
# 99ingot dracut module is present when postinst builds the initramfs.
ExtraTrees=files
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
KernelCommandLine=
    console=tty0
    console=ttyS0
    # state partition PARTUUID (fixed UUID, image/repart-baseline/40-var.conf):
    # the stock initramfs mounts it at /sysroot (root=), the initramfs
    # runtime-root prep (99ingot) mounts it at /var
    root=PARTUUID=501347aa-775a-5736-8da3-2a9977c820ec
    rootfstype=btrfs
    # active slot PARTUUID (fixed UUID, image/repart-baseline/20-slot-a.conf):
    # the initramfs mounts it read-only at /usr (99ingot)
    usr=PARTUUID=0066bfe5-47f1-52dc-9a16-1bb10191a1dc
    usrfstype=erofs
# Capability-based package set (rawhide NVRs at the pinned compose are
# recorded in dist/build-metadata.json; capability names are stable).
Packages=
    # base skeleton + identity
    basesystem,
    # core userland tools. The slot's binaries are the pinned-source
    # uutils build (spec 7.2, see [Build]); the distro package stays
    # installed because systemd, dracut, kernel-core, util-linux,
    # gzip, krb5-libs, authselect-libs and ca-certificates
    # hard-require it in the compose's rpm dependency graph, and its
    # files are shadowed by the uutils build in the final payload
    coreutils,
    # systemd core: PID 1, journald, units (run0/sysupdate included)
    systemd,
    # udevd, udevadm, bootctl
    systemd-udev,
    # dbus broker for userland
    dbus-broker,
    # shell for the initramfs (dracut shell-interpreter); the runtime
    # root's /bin/sh is brush (pinned Rust build, see [Build])
    bash,
    # kernel: vmlinuz + modules (erofs/btrfs load at boot)
    kernel,
    kernel-modules,
    kernel-modules-core,
    # CPU microcode: rawhide split the AMD microcode out of
    # linux-firmware into its own package (per-family container files
    # under /usr/lib/firmware/amd-ucode/)
    amd-ucode-firmware,
    # remaining firmware (virtio, etc.)
    linux-firmware,
    # initramfs generator (builds the non-hostonly initramfs in the
    # postinst script)
    dracut,
    # runtime networkd for the factory en* DHCP config
    systemd-networkd,
    # journal compression
    zstd,
    # module loading in the initramfs
    kmod,
    # registry-required coreutils (spec 7.1)
    util-linux,
    # registry-required (spec 7.1)
    libarchive,
    # systemd-boot fallback loader (unsigned; mkosi signs it,
    # SecureBoot=yes)
    systemd-boot-unsigned,
    # ukify for the UKI build (runs inside the image)
    systemd-ukify,
    # libnettle 3.10 runtime library: ingot-update-helper links it via
    # sequoia-openpgp's default crypto backend (nettle3.10, not nettle
    # 4.0: the nettle crate 7.x targets the 3.x C API)
    nettle3.10,
    # libgmp: transitive NEEDED of libhogweed (above)
    gmp,
    # runtime libraries for the pinned-source nushell build (spec 3.1):
    # nu dynamically links libssl/libcrypto (TLS) and libsqlite3
    # (query sqlite); openssl-libs also arrives transitively (systemd),
    # declared here because the shell needs it directly
    openssl-libs,
    sqlite-libs,

BuildPackages=
    rust,
    cargo,
    gcc,
    # nettle-sys (sequoia-openpgp build dep) probes libnettle via
    # pkg-config (nettle3.10-devel provides nettle.pc)
    nettle3.10-devel,
    # the chroot's /usr/bin/pkg-config is a wrapper that shells out to
    # rpm (absent from the slot); the build script uses the
    # platform-specific wrapper directly
    pkgconf,
    pkgconf-pkg-config,
    # nushell's openssl-sys build script needs the OpenSSL headers +
    # .pc files (the slot image itself carries no -dev packages)
    openssl-devel,
    # helix's build script drives git for the pinned tree-sitter
    # grammar repositories (pre-staged by the prepare phase, so no
    # network is needed in the chroot)
    git,
    # zellij's vendored OpenSSL build (vendored-curl feature) compiles
    # OpenSSL from source: perl (Configure) + make in the overlay
    perl,
    make,
    # uutils' chcon/runcon link selinux (selinux-sys needs the headers)
    selinux-devel,

# phase scripts are auto-discovered by filename (mkosi.prepare,
# mkosi.build.chroot, mkosi.postinst.chroot in this directory); do NOT
# also list them via PrepareScripts=/BuildScripts=/PostInstallationScripts=
# - that duplicates the entries and runs each script twice.
[Build]
# the in-repo Rust workspace (spec 7.1): mounted for the prepare
# scripts at $SRCDIR/ingot-src (mkosi mounts BuildSources under
# /work/src); the prepare final phase stages it into the artifacts
# dir, and the build script cargo-builds it there.
BuildSources=../src:ingot-src
# the Rust userland pinned sources: the thirdparty/ git submodules
# (one per component, checked out at the pinned commit in
# tools/pins.json) mounted at $SRCDIR/thirdparty; the prepare final
# phase stages each checkout into the artifacts dir, and the build
# script cargo-builds them there.
BuildSources=../thirdparty:thirdparty
# network for the build/postinst script sandboxes (universal-scope
# setting): the prepare (build) phase primes the cargo registry with the
# image's cargo (crates.io); the build script itself builds --offline
# against that cache
WithNetwork=yes
# The Rust userland is always from pinned source (standing decision):
# each component is a git submodule of this repo (thirdparty/<name>),
# checked out at the pinned upstream commit (tools/pins.json) and
# staged into the artifacts dir by the prepare phase (final arg), then
# cargo-built in the build script (chroot, with the build-overlay
# toolchain), never from a distro rpm.
# brush: the runtime root's /bin/sh (installed to /usr/bin/brush);
# nushell: the interactive
# admin shell (spec 3.1, installed to /usr/bin/nu plus the
# /usr/bin/nushell name); helix: the terminal editor (spec 7.2,
# installed to /usr/bin/helix plus the /usr/bin/hx name); zellij: the
# terminal multiplexer (spec 7.2, installed to /usr/bin/zellij);
# coreutils: uutils (spec 7.2, the core CLI utilities; its binaries
# shadow the distro coreutils files in the final payload - the distro
# package stays installed because systemd, dracut, kernel-core and
# util-linux hard-require it). Each *_SHA must match tools/pins.json
# (tools/check-pins.py enforces).
Environment=BRUSH_SHA=96a26d0c66cbc018a1517e9562944418fef5b272
Environment=NUSHELL_SHA=798c55d19505fd52f205d7eb32a571b9d06ec9e6
Environment=HELIX_SHA=a05c151bb6e8e9c65ec390b0ae2afe7a5efd619b
Environment=ZELLIJ_SHA=efd8fd5a89a20c07a111d248ad7fce53848d2c18
Environment=COREUTILS_SHA=dc1efd89948a9ca4c78c3a4b9a6ac891019a8c69

# Secure Boot: sign the UKI and the systemd-boot fallback with the
# snakeoil test key (project-level setting for this bootable image).
[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
SignExpectedPcr=no
SecureBootKey=../tools/keys/snakeoil.key
SecureBootCertificate=../tools/keys/snakeoil.pem
