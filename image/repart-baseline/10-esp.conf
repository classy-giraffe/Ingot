# Ingot ESP: FAT32, pinned PARTUUID.
# Populated from the image root (CopyFiles): /boot carries the signed
# UKI (EFI/Linux/), /efi the signed systemd-boot fallback (EFI/BOOT/).
# The disk output step formats the ESP partitions last (after the UKI
# build), so the UKI is included.
[Partition]
Type=esp
UUID=f357e520-642b-5b9b-abc7-9e5969de5691
Label=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=1G
SizeMaxBytes=1G
